version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: academy_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: academy_tulie
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  thelab:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: academy_thelab
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:5001
    restart: always

volumes:
  postgres_data:
