name: tulie_academy
services:
  postgres:
    image: postgres:15-alpine
    container_name: tulie_academy_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tulie_academy
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tulie_academy_redis
    ports:
      - "6383:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
