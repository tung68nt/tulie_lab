services:
  postgres:
    image: postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-tulie}_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tulie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-academy_tulie}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tulie} -d ${POSTGRES_DB:-academy_tulie}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-tulie}_redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/tung68nt/tulie_server:latest
    container_name: ${COMPOSE_PROJECT_NAME:-tulie}_server
    restart: always
    ports:
      - "${SERVER_PORT:-5001}:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tulie}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-academy_tulie}
      - DIRECT_URL=postgresql://${POSTGRES_USER:-tulie}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-academy_tulie}
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=${CLIENT_URL:-https://thelab.tulie.vn}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SEPAY_API_KEY=${SEPAY_API_KEY:-}
      - SEPAY_SECRET_KEY=${SEPAY_SECRET_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  client:
    image: ghcr.io/tung68nt/tulie_client:latest
    container_name: ${COMPOSE_PROJECT_NAME:-tulie}_client
    restart: always
    expose:
      - "3000"
    ports:
      - "${CLIENT_PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://thelab.tulie.vn/api
    depends_on:
      - server
    networks:
      - app-network

  nginx:
    image: ghcr.io/tung68nt/tulie_nginx:latest
    container_name: ${COMPOSE_PROJECT_NAME:-tulie}_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - client
      - server
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  uploads_data:


networks:
  app-network:
    driver: bridge
