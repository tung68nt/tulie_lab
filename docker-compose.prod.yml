name: tulie_academy
services:

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-tulie_academy}_redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  server:
    image: ghcr.io/tung68nt/tulie_lab_server:latest
    container_name: ${COMPOSE_PROJECT_NAME:-tulie_academy}_server
    restart: always
    ports:
      - "${SERVER_PORT:-5001}:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - DIRECT_URL=${DIRECT_URL:?DIRECT_URL is required}
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=${CLIENT_URL:-https://thelab.tulie.vn}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SEPAY_API_KEY=${SEPAY_API_KEY:-}
      - SEPAY_SECRET_KEY=${SEPAY_SECRET_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - NODE_OPTIONS=--max-old-space-size=512
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - redis
    networks:
      - app-network
      - coolify
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.thelab-api.rule=Host(`thelab.tulie.vn`) && PathPrefix(`/api`)"
      - "traefik.http.routers.thelab-api.entrypoints=https"
      - "traefik.http.routers.thelab-api.tls=true"
      - "traefik.http.routers.thelab-api.service=thelab-api"
      - "traefik.http.services.thelab-api.loadbalancer.server.port=8080"

  client:
    image: ghcr.io/tung68nt/tulie_lab_client:latest
    container_name: ${COMPOSE_PROJECT_NAME:-tulie_academy}_client
    restart: always
    expose:
      - "3000"
    ports:
      - "${CLIENT_PORT:-3001}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://thelab.tulie.vn/api
      - INTERNAL_API_URL=http://server:8080
      - NODE_OPTIONS=--max-old-space-size=512
    depends_on:
      - server
    networks:
      - app-network
      - coolify
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.thelab-client.rule=Host(`thelab.tulie.vn`)"
      - "traefik.http.routers.thelab-client.entrypoints=https"
      - "traefik.http.routers.thelab-client.tls=true"
      - "traefik.http.routers.thelab-client.service=thelab-client"
      - "traefik.http.services.thelab-client.loadbalancer.server.port=3000"
  # Nginx is handled by aaPanel on the host (manages SSL + reverse proxy)
  # aaPanel Nginx proxies: thelab.tulie.vn -> client:3001, /api -> server:5001

volumes:
  redis_data:
  uploads_data:


networks:
  app-network:
    driver: bridge
  coolify:
    external: true
