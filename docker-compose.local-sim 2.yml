version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - academy-network

  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      - redis
    networks:
      - academy-network

networks:
  academy-network:
    driver: bridge
