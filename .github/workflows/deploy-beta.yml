name: Deploy Beta to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - beta
    paths:
      - 'server/**'
      - 'client/**'
      - 'prisma/**'
      - 'docker-compose.beta.yml'
      - '.github/workflows/deploy-beta.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Beta Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Server (Beta)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}_server:beta
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Client (Beta)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}_client:beta
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://betathelab.tulie.vn/api

  deploy:
    name: Deploy Beta to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 60

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          command_timeout: 55m
          script: |
            set -e
            echo "🚀 Starting beta deployment..."

            # Ensure deployment directory exists
            if [ ! -d "/srv/betathelab.tulie.vn" ]; then
              echo "📁 Creating directory /srv/betathelab.tulie.vn..."
              sudo mkdir -p /srv/betathelab.tulie.vn
              sudo chown $(whoami):$(whoami) /srv/betathelab.tulie.vn
            fi

            cd /srv/betathelab.tulie.vn

            # Pull latest config via git
            if [ ! -d ".git" ]; then
              echo "📦 Initializing git repository..."
              git init
              git remote add origin https://${{ github.actor }}:${{ secrets.GHCR_TOKEN }}@github.com/${{ github.repository }}.git || \
              git remote set-url origin https://${{ github.actor }}:${{ secrets.GHCR_TOKEN }}@github.com/${{ github.repository }}.git
            else
              git remote set-url origin https://${{ github.actor }}:${{ secrets.GHCR_TOKEN }}@github.com/${{ github.repository }}.git
            fi

            echo "📥 Pulling latest beta config..."
            git fetch origin beta
            git reset --hard origin/beta

            # Log in to GHCR on VPS
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull images and deploy
            echo "🏗️ Pulling beta images and deploying..."
            docker compose -f docker-compose.beta.yml --env-file .env.beta pull server client
            docker compose -f docker-compose.beta.yml --env-file .env.beta up -d --force-recreate --remove-orphans

            # Run database migrations (same DB, but ensure schema is up to date for beta code)
            echo "🗄️ Running database migrations..."
            sleep 10
            docker compose -f docker-compose.beta.yml --env-file .env.beta exec -T server npx prisma migrate deploy || echo "⚠️ Migration warning"

            # Clean up old images
            echo "🧹 Cleaning up..."
            docker image prune -f

            # Health check
            echo "🩺 Checking health..."
            for i in {1..20}; do
              echo "Attempt $i..."
              # Check API
              CURL_OUT=$(curl -sf http://localhost:5002/api/health || echo "CURL_ERROR")
              API_HEALTH=$(echo "$CURL_OUT" | grep -q '"status":"ok"' && echo "API_OK" || echo "API_FAIL")
              
              # Check Web
              WEB_HEALTH=$(curl -sf http://localhost:3002 --max-time 10 | grep -q '<' && echo "WEB_OK" || echo "WEB_FAIL")
              
              # Check Domain
              DOMAIN_HEALTH=$(curl -sfL https://betathelab.tulie.vn --max-time 10 | grep -q '<' && echo "DOMAIN_OK" || echo "DOMAIN_FAIL")

              echo "Status: API=$API_HEALTH, Web=$WEB_HEALTH, Domain=$DOMAIN_HEALTH"
              if [ "$API_HEALTH" = "API_OK" ] && [ "$WEB_HEALTH" = "WEB_OK" ] && [ "$DOMAIN_HEALTH" = "DOMAIN_OK" ]; then
                echo "✅ All Beta Health Checks Passed!"
                exit 0
              fi
              
              sleep 10
            done
            
            echo "📜 Container Logs (Debug):"
            docker compose -f docker-compose.beta.yml --env-file .env.beta logs --tail 100 client
            exit 0
