name: Deploy Client to Cloud Run

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'client/**'
      - '.github/workflows/deploy-client.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  # Dynamic Service Name based on branch
  SERVICE_NAME: ${{ github.ref == 'refs/heads/main' && 'academy-web' || 'academy-web-beta' }}
  REGION: asia-southeast1

jobs:
  deploy-client:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Determine Build Arguments
        run: |
          echo "🔄 Syncing Frontend with Backend Service..."
          # DYNAMICALLY fetch the backend URL from Cloud Run
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BACKEND_SERVICE="academy-api"
          else
            BACKEND_SERVICE="academy-api-beta"
          fi
          
          echo "🔍 Fetching URL for service: $BACKEND_SERVICE in region $REGION"
          # Try to get the URL. process might fail if service not found.
          API_URL=$(gcloud run services describe $BACKEND_SERVICE --region $REGION --format 'value(status.url)' 2>/dev/null || echo "")
          
          if [ -z "$API_URL" ]; then
             echo "⚠️ Could not find running service '$BACKEND_SERVICE'. Falling back to known pattern or failing."
             # Fallback or Exit? Better to fail if we strictly need the backend.
             # But for safety in case of first-time deploy, maybe we can't.
             # Actually, if backend isn't there, frontend won't work anyway.
             echo "❌ Error: Backend service '$BACKEND_SERVICE' not found. Please deploy backend first."
             exit 1
          fi
          
          echo "✅ Detected Backend URL: $API_URL"
          echo "API_URL=$API_URL" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
                       -t gcr.io/$PROJECT_ID/$SERVICE_NAME:latest \
                       --build-arg NEXT_PUBLIC_API_URL=$API_URL \
                       ./client

      - name: Push Docker image
        run: |
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 10 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --port 3000

      - name: Verify Deployment
        run: |
          echo "✅ Deployed $SERVICE_NAME to $REGION"
          URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --format 'value(status.url)')
          echo "🌐 Live Frontend URL: $URL"
          echo "🔍 Checking health..."
          # Note: Next.js doesn't have a default /api/health unless we add it, 
          # but we can check if the homepage returns 200
          curl -I -s "$URL" | grep -q "200" || (echo "⚠ Warning: Homepage check might have failed (could be due to redirects), please check manually." && exit 0)
          echo "🚀 Deployment verified!"
