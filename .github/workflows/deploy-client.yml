name: Deploy Client to Cloud Run

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'client/**'
      - '.github/workflows/deploy-client.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  # Dynamic Service Name based on branch
  SERVICE_NAME: ${{ github.ref == 'refs/heads/main' && 'academy-web' || 'academy-web-beta' }}
  REGION: asia-southeast1

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build -t gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
                       -t gcr.io/$PROJECT_ID/$SERVICE_NAME:latest \
                       ./client

      - name: Push Docker image
        run: |
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:latest

      - name: Determine Environment Variables
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "NEXT_PUBLIC_API_URL=https://api.thelab.tulie.vn" >> $GITHUB_ENV
          else
            echo "NEXT_PUBLIC_API_URL=https://api.beta.thelab.tulie.vn" >> $GITHUB_ENV
          fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --set-env-vars "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" \
            --min-instances 0 \
            --max-instances 10 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300

      - name: Show Cloud Run URL
        run: |
          echo "Deployed to:"
          gcloud run services describe $SERVICE_NAME --region $REGION --format 'value(status.url)'
