name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'client/**'
      - 'prisma/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}_server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}_client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://thelab.tulie.vn/api

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting deployment..."

            # Ensure deployment directory exists
            if [ ! -d "/srv/thelab.tulie.vn" ]; then
              echo "📁 Creating directory /srv/thelab.tulie.vn..."
              sudo mkdir -p /srv/thelab.tulie.vn
              sudo chown $(whoami):$(whoami) /srv/thelab.tulie.vn
            fi

            cd /srv/thelab.tulie.vn

            # Pull latest config via git
            if [ ! -d ".git" ]; then
              echo "📦 Initializing git repository..."
              git init
              # Use token for authentication to private repo
              git remote add origin https://${{ github.actor }}:${{ secrets.GHCR_TOKEN }}@github.com/${{ github.repository }}.git || \
              git remote set-url origin https://${{ github.actor }}:${{ secrets.GHCR_TOKEN }}@github.com/${{ github.repository }}.git
            else
              # Always update remote in case token changed or initial remote was wrong
              git remote set-url origin https://${{ github.actor }}:${{ secrets.GHCR_TOKEN }}@github.com/${{ github.repository }}.git
            fi

            echo "📥 Pulling latest config..."
            git fetch origin main
            git reset --hard origin/main

            # Log in to GHCR on VPS using PAT
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull images and deploy
            echo "🏗️ Pulling images and deploying..."
            docker compose -f docker-compose.prod.yml --env-file .env.production pull server client
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --force-recreate --remove-orphans

            # Run database migrations
            echo "🗄️ Running database migrations..."
            sleep 10
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T server npx prisma migrate deploy || echo "⚠️ Migration warning"

            # Clean up old images
            echo "🧹 Cleaning up..."
            docker image prune -f

            # Health check (check internal ports to verify containers started correctly)
            echo "🩺 Checking health..."
            for i in {1..20}; do
              echo "Attempt $i..."
              # Check API
              CURL_OUT=$(curl -sf http://localhost:5001/api/health || echo "CURL_ERROR")
              API_HEALTH=$(echo "$CURL_OUT" | grep -q '"status":"ok"' && echo "API_OK" || echo "API_FAIL")
              
              # Check Web
              WEB_HEALTH=$(curl -sf http://localhost:3001 --max-time 10 | grep -q '<' && echo "WEB_OK" || echo "WEB_FAIL")
              
              # Check Domain
              DOMAIN_HEALTH=$(curl -sfL https://thelab.tulie.vn --max-time 10 | grep -q '<' && echo "DOMAIN_OK" || echo "DOMAIN_FAIL")

              echo "Status: API=$API_HEALTH, Web=$WEB_HEALTH, Domain=$DOMAIN_HEALTH"
              if [ "$API_HEALTH" = "API_OK" ] && [ "$WEB_HEALTH" = "WEB_OK" ] && [ "$DOMAIN_HEALTH" = "DOMAIN_OK" ]; then
                echo "✅ All Health Checks Passed!"
                exit 0
              fi
              
              if [ "$API_HEALTH" = "API_OK" ] && [ "$WEB_HEALTH" = "WEB_OK" ]; then
                 echo "⚠️ Internal OK but Domain FAIL - waiting..."
              fi
              
              if [ "$API_HEALTH" = "API_FAIL" ] && [ "$CURL_OUT" != "CURL_ERROR" ]; then
                echo "API Health Response: $CURL_OUT"
              fi
              
              sleep 10
            done
            
            echo "📜 Container Logs (Debug):"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100 client
            exit 0

            echo "❌ Health Check failed after 3 minutes."
            echo "📜 Container Logs:"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100
            exit 1

