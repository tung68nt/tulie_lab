name: Deploy Back-End to Cloud Run

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'server/**'
      - 'prisma/**'
      - '.github/workflows/deploy.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: ${{ github.ref == 'refs/heads/main' && 'academy-api' || 'academy-api-beta' }}
  REGION: asia-southeast1

jobs:
  deploy:
    name: Build, Migrate & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Determine Environment Variables
        id: env-vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            DB_URL="${{ secrets.DATABASE_URL_PROD || secrets.DATABASE_URL }}"
            DIR_URL="${{ secrets.DIRECT_URL_PROD || secrets.DIRECT_URL }}"
            S_URL="${{ secrets.SUPABASE_URL_PROD || secrets.SUPABASE_URL }}"
            S_KEY="${{ secrets.SUPABASE_ANON_KEY_PROD || secrets.SUPABASE_ANON_KEY }}"
            CLIENT_URL="https://thelab.tulie.vn"
          else
            DB_URL="${{ secrets.DATABASE_URL_BETA || secrets.BETA_DATABASE_URL || secrets.DATABASE_URL }}"
            DIR_URL="${{ secrets.DIRECT_URL_BETA || secrets.BETA_DIRECT_URL || secrets.DIRECT_URL }}"
            S_URL="${{ secrets.SUPABASE_URL_BETA || secrets.SUPABASE_URL }}"
            S_KEY="${{ secrets.SUPABASE_ANON_KEY_BETA || secrets.SUPABASE_ANON_KEY }}"
            CLIENT_URL="https://beta.thelab.tulie.vn"
          fi

          if [ -z "$DB_URL" ]; then echo "❌ DATABASE_URL is missing!"; exit 1; fi
          if [ -z "$DIR_URL" ]; then DIR_URL="$DB_URL"; fi

          # Export
          echo "RUNTIME_DB_URL=$DB_URL" >> $GITHUB_ENV
          echo "RUNTIME_DIR_URL=$DIR_URL" >> $GITHUB_ENV
          echo "RUNTIME_S_URL=$S_URL" >> $GITHUB_ENV
          echo "RUNTIME_S_KEY=$S_KEY" >> $GITHUB_ENV
          echo "ENV_CLIENT_URL=$CLIENT_URL" >> $GITHUB_ENV

      - name: Install dependencies, Generate Prisma & Build
        working-directory: ./server
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Run Database Migrations
        working-directory: ./server
        env:
          DATABASE_URL: ${{ env.RUNTIME_DIR_URL }}
        run: |
          echo "🚀 Running Database Migrations..."
          npx prisma migrate deploy || echo "⚠️ Migration warning: Check database state."

      - name: Build and Push Docker image
        run: |
          TAG="gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }}"
          LATEST="gcr.io/$PROJECT_ID/$SERVICE_NAME:latest"
          docker build -t "$TAG" -t "$LATEST" ./server
          docker push "$TAG"
          docker push "$LATEST"
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Post-Build Smoke Test (Verify Startup)
        working-directory: ./server
        env:
          DATABASE_URL: ${{ env.RUNTIME_DB_URL }}
          JWT_SECRET: "smoke-test-secret"
          PORT: 8080
          NODE_ENV: production
        run: |
          echo "🚀 Starting 10s Smoke Test..."
          # Start app in background, wait 10s, then kill it.
          # If it crashes before 10s, it's a failed build.
          timeout 15s node dist/index.js &
          PID=$!
          sleep 10
          if ps -p $PID > /dev/null; then
            echo "✅ App stayed alive for 10s. Killing process..."
            kill $PID
          else
            echo "❌ App crashed within 10s! Check logs above."
            exit 1
          fi

      - name: Create Environment File
        run: |
          cat <<EOF > env.yaml
          NODE_ENV: production
          DATABASE_URL: "$RUNTIME_DB_URL"
          DIRECT_URL: "$RUNTIME_DIR_URL"
          CLIENT_URL: "$ENV_CLIENT_URL"
          REDIS_URL: "${{ secrets.REDIS_URL }}"
          JWT_SECRET: "${{ secrets.JWT_SECRET }}"
          R2_ACCOUNT_ID: "${{ secrets.R2_ACCOUNT_ID }}"
          R2_ACCESS_KEY_ID: "${{ secrets.R2_ACCESS_KEY_ID }}"
          R2_SECRET_ACCESS_KEY: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          R2_BUCKET_NAME: "${{ secrets.R2_BUCKET_NAME }}"
          R2_PUBLIC_DOMAIN: "${{ secrets.R2_PUBLIC_DOMAIN }}"
          SUPABASE_URL: "$RUNTIME_S_URL"
          SUPABASE_ANON_KEY: "$RUNTIME_S_KEY"
          SEPAY_API_KEY: "${{ secrets.SEPAY_API_KEY }}"
          SEPAY_SECRET_KEY: "${{ secrets.SEPAY_SECRET_KEY }}"
          SMTP_HOST: "${{ secrets.SMTP_HOST }}"
          SMTP_PORT: "${{ secrets.SMTP_PORT }}"
          SMTP_USER: "${{ secrets.SMTP_USER }}"
          SMTP_PASS: "${{ secrets.SMTP_PASS }}"
          SMTP_FROM: "${{ secrets.SMTP_FROM }}"
          ANTHROPIC_BASE_URL: "${{ secrets.ANTHROPIC_BASE_URL }}"
          ANTHROPIC_MODEL: "${{ secrets.ANTHROPIC_MODEL }}"
          ANTHROPIC_AUTH_TOKEN: "${{ secrets.ANTHROPIC_AUTH_TOKEN }}"
          EOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_TAG \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --env-vars-file env.yaml \
            --min-instances 0 \
            --max-instances 10 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 600 \
            --quiet

      - name: Verify Deployment Logic
        run: |
          URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --format 'value(status.url)' || echo "")
          if [ -z "$URL" ]; then
            echo "❌ Could not retrieve Service URL."
            exit 1
          fi
          
          echo "🌐 Live URL: $URL"
          echo "🩺 Polling Health Check (max 3 mins)..."
          
          for i in {1..12}; do
            echo "Attempt $i..."
            # Use curl with -L following redirects and -i to see headers
            RESPONSE=$(curl -L -i -s --max-time 10 "$URL/api/health" || echo "timeout")
            echo "--- HTTP Snippet ---"
            echo "$RESPONSE" | head -n 30
            
            if echo "$RESPONSE" | grep -q '{"status":"ok"'; then
              echo "✅ Health Check Passed!"
              exit 0
            elif echo "$RESPONSE" | grep -q '{"status":"starting"'; then
              echo "⏳ App is still starting (Initializing services)..."
            fi
            sleep 15
          done
          
          echo "❌ Health Check failed after 3 minutes."
          exit 1
