name: Deploy Back-End to Cloud Run

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'server/**'
      - 'prisma/**'
      - '.github/workflows/deploy.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  # Dynamic Service Name based on branch
  SERVICE_NAME: ${{ github.ref == 'refs/heads/main' && 'academy-api' || 'academy-api-beta' }}
  REGION: asia-southeast1

jobs:
  # 1. Run database migrations FIRST (Optional - continues even on failure)
  migrate:
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't block deploy if migrations fail (common for direct connection issues in CI)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Configure Environment
        id: config-env
        run: |
          # Determine secrets based on branch
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            DB="${{ secrets.DATABASE_URL_PROD }}"
            if [ -z "$DB" ]; then DB="${{ secrets.DATABASE_URL }}"; fi
            DIR="${{ secrets.DIRECT_URL_PROD }}"
            if [ -z "$DIR" ]; then DIR="${{ secrets.DIRECT_URL }}"; fi
          else
            DB="${{ secrets.DATABASE_URL_BETA }}"
            if [ -z "$DB" ]; then DB="${{ secrets.BETA_DATABASE_URL }}"; fi
            DIR="${{ secrets.DIRECT_URL_BETA }}"
            if [ -z "$DIR" ]; then DIR="${{ secrets.BETA_DIRECT_URL }}"; fi
          fi

          # Fallback for DIRECT_URL
          if [ -z "$DIR" ]; then
            echo "⚠️ DIRECT_URL is not set for branch ${{ github.ref }}. Falling back to DATABASE_URL."
            DIR="$DB"
          fi
          
          # Enforce pgbouncer=true and statement_cache_size=0 for Transaction Pooler (port 6543)
          if [[ "$DB" == *":6543"* ]] || [[ "$DB" == *"pgbouncer=true"* ]]; then
             if [[ "$DB" != *"pgbouncer=true"* ]]; then
                if [[ "$DB" == *"?"* ]]; then DB="${DB}&pgbouncer=true"; else DB="${DB}?pgbouncer=true"; fi
             fi
             if [[ "$DB" != *"statement_cache_size="* ]]; then
                if [[ "$DB" == *"?"* ]]; then DB="${DB}&statement_cache_size=0"; else DB="${DB}?statement_cache_size=0"; fi
             fi
             echo "🔌 Optimized DATABASE_URL for PgBouncer"
          fi

          # Mask values just in case
          echo "::add-mask::$DB"
          echo "::add-mask::$DIR"

          # Export to GITHUB_ENV for subsequent steps
          echo "DATABASE_URL=$DB" >> $GITHUB_ENV
          echo "DIRECT_URL=$DIR" >> $GITHUB_ENV

      - name: Debug Database Connection
        run: |
          echo "🔍 Checking DATABASE_URL format..."
          # Show only protocol and host (masked password)
          DB_HOST=$(echo "$DATABASE_URL" | sed -E 's|postgresql://[^@]+@([^/]+).*|\1|')
          echo "Database host: $DB_HOST"

          DIRECT_HOST=$(echo "$DIRECT_URL" | sed -E 's|postgresql://[^@]+@([^/]+).*|\1|')
          echo "Direct connection host: $DIRECT_HOST"

          # Check if URL is set
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ ERROR: DATABASE_URL is empty!"
            exit 1
          fi

          if [ -z "$DIRECT_URL" ]; then
            echo "⚠️  WARNING: DIRECT_URL is empty, using DATABASE_URL fallback"
          fi

      - name: Run migrations
        working-directory: ./server
        run: |
          echo "🚀 Running Prisma generate..."
          npx prisma generate

          echo "🚀 Running Migrations..."
          npx prisma migrate deploy || echo "⚠️ Migration failed but proceeding..."

  # 2. Deploy only if migrations succeed
  deploy:
    needs: migrate
    if: success() || failure()
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build -t gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
                       -t gcr.io/$PROJECT_ID/$SERVICE_NAME:latest \
                       ./server

      - name: Push Docker image
        run: |
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:latest

      - name: Determine Database and Supabase URLs for Runtime Env
        id: db-env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            DB_URL="${{ secrets.DATABASE_URL_PROD }}"
            if [ -z "$DB_URL" ]; then DB_URL="${{ secrets.DATABASE_URL }}"; fi
            DIR_URL="${{ secrets.DIRECT_URL_PROD }}"
            if [ -z "$DIR_URL" ]; then DIR_URL="${{ secrets.DIRECT_URL }}"; fi
            
            S_URL="${{ secrets.SUPABASE_URL_PROD }}"
            if [ -z "$S_URL" ]; then S_URL="${{ secrets.SUPABASE_URL }}"; fi
            S_KEY="${{ secrets.SUPABASE_ANON_KEY_PROD }}"
            if [ -z "$S_KEY" ]; then S_KEY="${{ secrets.SUPABASE_ANON_KEY }}"; fi
          else
            DB_URL="${{ secrets.DATABASE_URL_BETA }}"
            if [ -z "$DB_URL" ]; then DB_URL="${{ secrets.BETA_DATABASE_URL }}"; fi
            DIR_URL="${{ secrets.DIRECT_URL_BETA }}"
            if [ -z "$DIR_URL" ]; then DIR_URL="${{ secrets.BETA_DIRECT_URL }}"; fi
            
            S_URL="${{ secrets.SUPABASE_URL_BETA }}"
            if [ -z "$S_URL" ]; then S_URL="${{ secrets.SUPABASE_URL }}"; fi
            S_KEY="${{ secrets.SUPABASE_ANON_KEY_BETA }}"
            if [ -z "$S_KEY" ]; then S_KEY="${{ secrets.SUPABASE_ANON_KEY }}"; fi
          fi

          if [ -z "$DIR_URL" ]; then
             echo "⚠️ Warning: DIRECT_URL is not set for runtime branch ${{ github.ref }}. Falling back to DATABASE_URL."
             DIR_URL="$DB_URL"
          fi

          # Enforce pgbouncer=true and statement_cache_size=0 for Runtime Env
          if [[ "$DB_URL" == *":6543"* ]] || [[ "$DB_URL" == *"pgbouncer=true"* ]]; then
             if [[ "$DB_URL" != *"pgbouncer=true"* ]]; then
                if [[ "$DB_URL" == *"?"* ]]; then DB_URL="${DB_URL}&pgbouncer=true"; else DB_URL="${DB_URL}?pgbouncer=true"; fi
             fi
             if [[ "$DB_URL" != *"statement_cache_size="* ]]; then
                if [[ "$DB_URL" == *"?"* ]]; then DB_URL="${DB_URL}&statement_cache_size=0"; else DB_URL="${DB_URL}?statement_cache_size=0"; fi
             fi
             echo "🔌 Optimized Runtime DATABASE_URL for PgBouncer"
          fi

          echo "RUNTIME_DB_URL=$DB_URL" >> $GITHUB_ENV
          echo "RUNTIME_DIRECT_URL=$DIR_URL" >> $GITHUB_ENV
          echo "RUNTIME_SUPABASE_URL=$S_URL" >> $GITHUB_ENV
          echo "RUNTIME_SUPABASE_ANON_KEY=$S_KEY" >> $GITHUB_ENV

      - name: Determine Config Vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV_CLIENT_URL=https://thelab.tulie.vn" >> $GITHUB_ENV
          else
            echo "ENV_CLIENT_URL=https://beta.thelab.tulie.vn" >> $GITHUB_ENV
          fi

      - name: Deploy Back-End to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,DATABASE_URL=$RUNTIME_DB_URL,DIRECT_URL=$RUNTIME_DIRECT_URL" \
            --set-env-vars "CLIENT_URL=$ENV_CLIENT_URL" \
            --set-env-vars "REDIS_URL=${{ secrets.REDIS_URL }}" \
            --set-env-vars "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" \
            --set-env-vars "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" \
            --set-env-vars "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            --set-env-vars "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}" \
            --set-env-vars "R2_PUBLIC_DOMAIN=${{ secrets.R2_PUBLIC_DOMAIN }}" \
            --set-env-vars "SUPABASE_URL=$RUNTIME_SUPABASE_URL" \
            --set-env-vars "SUPABASE_ANON_KEY=$RUNTIME_SUPABASE_ANON_KEY" \
            --set-env-vars "SEPAY_API_KEY=${{ secrets.SEPAY_API_KEY }}" \
            --set-env-vars "ANTHROPIC_BASE_URL=${{ secrets.ANTHROPIC_BASE_URL }}" \
            --set-env-vars "ANTHROPIC_MODEL=${{ secrets.ANTHROPIC_MODEL }}" \
            --set-env-vars "ANTHROPIC_AUTH_TOKEN=${{ secrets.ANTHROPIC_AUTH_TOKEN }}" \
            --set-env-vars "SEPAY_SECRET_KEY=${{ secrets.SEPAY_SECRET_KEY }}" \
            --set-env-vars "SMTP_HOST=${{ secrets.SMTP_HOST }}" \
            --set-env-vars "SMTP_PORT=${{ secrets.SMTP_PORT }}" \
            --set-env-vars "SMTP_USER=${{ secrets.SMTP_USER }}" \
            --set-env-vars "SMTP_PASS=${{ secrets.SMTP_PASS }}" \
            --set-env-vars "SMTP_FROM=${{ secrets.SMTP_FROM }}" \
            --min-instances 0 \
            --max-instances 10 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 600

      - name: Verify Deployment
        run: |
          echo "✅ Deployed $SERVICE_NAME to $REGION"
          URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --format 'value(status.url)')
          echo "🌐 Live URL: $URL"
          echo "🩺 Health check: $URL/api/health"
          echo "⏳ Waiting for service to stabilize (Attempt 1)..."
          sleep 20
          RESPONSE=$(curl -s --max-time 15 "$URL/api/health" || echo "timeout")
          echo "Response 1: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q "\"status\":\"ok\"" || echo "$RESPONSE" | grep -q "\"status\": \"ok\"" || echo "$RESPONSE" | grep -q "\"status\":\"initializing\""; then
            echo "🚀 Health check looks promising (initializing or ok)!"
          else
            echo "⏳ Attempt 2 (waiting 30s more)..."
            sleep 30
            RESPONSE=$(curl -s --max-time 15 "$URL/api/health" || echo "timeout")
            echo "Response 2: $RESPONSE"
            if echo "$RESPONSE" | grep -q "\"status\":\"ok\"" || echo "$RESPONSE" | grep -q "\"status\": \"ok\"" || echo "$RESPONSE" | grep -q "\"status\":\"initializing\""; then
              echo "🚀 Health check passed on retry!"
            else
              echo "⚠ Warning: Health check still returned unexpected response, check logs: $RESPONSE"
            fi
          fi
