name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'client/**'
      - 'prisma/**'
      - 'nginx/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}_server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}_client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://thelab.tulie.vn/api

      - name: Build and push Nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}_nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting deployment..."

            # Ensure deployment directory exists
            if [ ! -d "/srv/thelab.tulie.vn" ]; then
              echo "📁 Creating directory /srv/thelab.tulie.vn..."
              sudo mkdir -p /srv/thelab.tulie.vn
              sudo chown ${{ secrets.VPS_USER }}:${{ secrets.VPS_USER }} /srv/thelab.tulie.vn
            fi

            cd /srv/thelab.tulie.vn

            # Download docker-compose.prod.yml if it changed (or just keep it updated via git if needed)
            # Standard way: we still use git to pull the compose file and nginx configs
            if [ ! -d ".git" ]; then
              echo "📦 Initializing git repository..."
              git init
              git remote add origin https://github.com/${{ github.repository }}.git || git remote set-url origin https://github.com/${{ github.repository }}.git
            fi

            echo "📥 Pulling latest config..."
            git fetch origin main
            git reset --hard origin/main

            # Log in to GHCR on VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull images and deploy
            echo "🏗️ Pulling images and deploying..."
            docker compose -f docker-compose.prod.yml --env-file .env.production pull
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d

            # Run database migrations
            echo "🗄️ Running database migrations..."
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T server npx prisma migrate deploy || echo "⚠️ Migration warning"

            # Clean up old images
            echo "🧹 Cleaning up..."
            docker image prune -f

            # Health check
            echo "🩺 Checking health..."
            for i in {1..12}; do
              echo "Attempt $i..."
              API_HEALTH=$(curl -sf http://localhost/api/health | grep -q '"status":"ok"' && echo "API_OK" || echo "API_FAIL")
              WEB_HEALTH=$(curl -sf http://localhost | grep -q '<body' && echo "WEB_OK" || echo "WEB_FAIL")
              
              if [ "$API_HEALTH" = "API_OK" ] && [ "$WEB_HEALTH" = "WEB_OK" ]; then
                echo "✅ Health Check Passed (API & Web)!"
                exit 0
              fi
              echo "Status: API=$API_HEALTH, Web=$WEB_HEALTH"
              sleep 10
            done

            echo "❌ Health Check failed after 2 minutes."
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100
            exit 1
