name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'server/**'
      - 'prisma/**'
      - '.github/workflows/deploy.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  # Dynamic Service Name based on branch
  SERVICE_NAME: ${{ github.ref == 'refs/heads/main' && 'academy-api' || 'academy-api-beta' }}
  REGION: asia-southeast1

jobs:
  # 1. Run database migrations FIRST
  migrate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Set Database Config
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
            echo "DIRECT_URL=${{ secrets.DIRECT_URL }}" >> $GITHUB_ENV
          else
            echo "DATABASE_URL=${{ secrets.BETA_DATABASE_URL }}" >> $GITHUB_ENV
            echo "DIRECT_URL=${{ secrets.BETA_DIRECT_URL }}" >> $GITHUB_ENV
          fi

      - name: Run migrations
        working-directory: ./server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.BETA_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.BETA_DIRECT_URL }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            DB_URL="${{ secrets.DATABASE_URL }}"
            DIR_URL="${{ secrets.DIRECT_URL }}"
          else
            DB_URL="${{ secrets.BETA_DATABASE_URL }}"
            DIR_URL="${{ secrets.BETA_DIRECT_URL }}"
          fi
          
          if [ -z "$DB_URL" ]; then
            echo "❌ Error: DATABASE_URL is not set for branch ${{ github.ref }}"
            exit 1
          fi

          if [ -z "$DIR_URL" ]; then
            echo "⚠️ Warning: DIRECT_URL is not set for branch ${{ github.ref }}. Falling back to DATABASE_URL. This may fail if using a transaction pooler."
            DIR_URL="$DB_URL"
          fi
          
          echo "🚀 Running Prisma generate..."
          npx prisma generate
          
          echo "🚀 Running DB Push..."
          DATABASE_URL="$DB_URL" DIRECT_URL="$DIR_URL" npx prisma db push --accept-data-loss
          
          echo "🔧 Running Manual Schema Repair..."
          DATABASE_URL="$DB_URL" DIRECT_URL="$DIR_URL" npx tsx src/fix-schema.ts

      - name: Run seeds
        working-directory: ./server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.BETA_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.BETA_DIRECT_URL }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            DB_URL="${{ secrets.DATABASE_URL }}"
            DIR_URL="${{ secrets.DIRECT_URL }}"
          else
            DB_URL="${{ secrets.BETA_DATABASE_URL }}"
            DIR_URL="${{ secrets.BETA_DIRECT_URL }}"
          fi
          
          if [ -z "$DIR_URL" ]; then
             echo "⚠️ Warning: DIRECT_URL is not set for branch ${{ github.ref }}. Falling back to DATABASE_URL."
             DIR_URL="$DB_URL"
          fi
          
          echo "🚀 Running Seeds..."
          DATABASE_URL="$DB_URL" DIRECT_URL="$DIR_URL" npx tsx src/seed.ts
          DATABASE_URL="$DB_URL" DIRECT_URL="$DIR_URL" npx tsx prisma/seed-products.ts
          DATABASE_URL="$DB_URL" DIRECT_URL="$DIR_URL" npx tsx prisma/seed-landing-page.ts

  # 2. Deploy only if migrations succeed
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build -t gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
                       -t gcr.io/$PROJECT_ID/$SERVICE_NAME:latest \
                       ./server

      - name: Push Docker image
        run: |
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:latest

      - name: Determine Database URL for Runtime Env
        id: db-env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            DB_URL="${{ secrets.DATABASE_URL }}"
            DIR_URL="${{ secrets.DIRECT_URL }}"
          else
            DB_URL="${{ secrets.BETA_DATABASE_URL }}"
            DIR_URL="${{ secrets.BETA_DIRECT_URL }}"
          fi

          if [ -z "$DIR_URL" ]; then
             echo "⚠️ Warning: DIRECT_URL is not set for runtime branch ${{ github.ref }}. Falling back to DATABASE_URL."
             DIR_URL="$DB_URL"
          fi

          echo "RUNTIME_DB_URL=$DB_URL" >> $GITHUB_ENV
          echo "RUNTIME_DIRECT_URL=$DIR_URL" >> $GITHUB_ENV

      - name: Determine Config Vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV_CLIENT_URL=https://thelab.tulie.vn" >> $GITHUB_ENV
          else
            echo "ENV_CLIENT_URL=https://beta.thelab.tulie.vn" >> $GITHUB_ENV
          fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,DATABASE_URL=$RUNTIME_DB_URL,DIRECT_URL=$RUNTIME_DIRECT_URL" \
            --set-env-vars "CLIENT_URL=$ENV_CLIENT_URL" \
            --set-env-vars "REDIS_URL=${{ secrets.REDIS_URL }}" \
            --set-env-vars "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" \
            --set-env-vars "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" \
            --set-env-vars "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            --set-env-vars "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}" \
            --set-env-vars "R2_PUBLIC_DOMAIN=${{ secrets.R2_PUBLIC_DOMAIN }}" \
            --min-instances 0 \
            --max-instances 10 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300

      - name: Verify Deployment
        continue-on-error: true
        run: |
          echo "✅ Deployed $SERVICE_NAME to $REGION"
          URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --format 'value(status.url)')
          echo "🌐 Live URL: $URL"
          echo "🩺 Health check: $URL/api/health"
          echo "⏳ Waiting for service to stabilize (Attempt 1)..."
          sleep 15
          RESPONSE=$(curl -s --max-time 10 "$URL/api/health" || echo "timeout")
          echo "Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q "v1.0.2-verify"; then
            echo "🚀 Health check passed!"
          else
            echo "⏳ Attempt 2 (waiting 20s more)..."
            sleep 20
            RESPONSE=$(curl -s --max-time 10 "$URL/api/health" || echo "timeout")
            echo "Response: $RESPONSE"
            if echo "$RESPONSE" | grep -q "v1.0.2-verify"; then
              echo "🚀 Health check passed!"
            else
              echo "⚠ Warning: Version check still failing, but proceeding to migrations. The service might still be rolling out."
            fi
          fi
