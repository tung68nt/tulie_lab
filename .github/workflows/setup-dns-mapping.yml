name: Setup DNS Mapping (Manual)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain to map (beta or prod or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - beta
          - prod

jobs:
  setup-dns:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Beta Domain Mapping
        if: ${{ github.event.inputs.domain == 'beta' || github.event.inputs.domain == 'both' }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🟦 Setting up BETA domain mapping"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          DOMAIN="beta.thelab.tulie.vn"
          SERVICE="academy-web-beta"
          REGION="asia-southeast1"

          # Check if mapping exists
          if gcloud run domain-mappings describe "$DOMAIN" &> /dev/null; then
            echo "⚠️  Domain mapping already exists, deleting..."
            gcloud run domain-mappings delete "$DOMAIN" --quiet || true
          fi

          # Create mapping
          echo "🔧 Creating domain mapping..."
          gcloud beta run domain-mappings create \
            --service "$SERVICE" \
            --domain "$DOMAIN" \
            --region "$REGION"

          echo "✅ Beta domain mapping created!"
          echo ""

          # Get DNS records
          echo "📝 DNS Records to configure:"
          gcloud run domain-mappings describe "$DOMAIN" \
            --format="table[box](status.resourceRecords.name,status.resourceRecords.type,status.resourceRecords.rrdata)"

          echo ""
          echo "📋 A Records (for DNS provider):"
          gcloud run domain-mappings describe "$DOMAIN" \
            --format="value(status.resourceRecords.filter(type:A).rrdata)" | tr ';' '\n'

      - name: Setup Production Domain Mapping
        if: ${{ github.event.inputs.domain == 'prod' || github.event.inputs.domain == 'both' }}
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🟩 Setting up PRODUCTION domain mapping"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          DOMAIN="thelab.tulie.vn"
          SERVICE="academy-web"
          REGION="asia-southeast1"

          # Check if mapping exists
          if gcloud run domain-mappings describe "$DOMAIN" &> /dev/null; then
            echo "⚠️  Domain mapping already exists, deleting..."
            gcloud run domain-mappings delete "$DOMAIN" --quiet || true
          fi

          # Create mapping
          echo "🔧 Creating domain mapping..."
          gcloud beta run domain-mappings create \
            --service "$SERVICE" \
            --domain "$DOMAIN" \
            --region "$REGION"

          echo "✅ Production domain mapping created!"
          echo ""

          # Get DNS records
          echo "📝 DNS Records to configure:"
          gcloud run domain-mappings describe "$DOMAIN" \
            --format="table[box](status.resourceRecords.name,status.resourceRecords.type,status.resourceRecords.rrdata)"

          echo ""
          echo "📋 A Records (for DNS provider):"
          gcloud run domain-mappings describe "$DOMAIN" \
            --format="value(status.resourceRecords.filter(type:A).rrdata)" | tr ';' '\n'

      - name: Summary
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Domain Mapping Setup Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📝 Next Steps:"
          echo ""
          echo "1. Copy the A records from the output above"
          echo ""
          echo "2. Go to your DNS provider and:"
          echo "   ❌ DELETE old Vercel records (CNAME or A records)"
          echo "   ✅ ADD the new A records shown above"
          echo ""
          echo "3. Wait 5-15 minutes for DNS propagation"
          echo ""
          echo "4. Verify with:"
          echo "   dig beta.thelab.tulie.vn +short"
          echo "   dig thelab.tulie.vn +short"
          echo ""
          echo "5. Or run the verification workflow"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
